apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyvcs
  namespace: easydev
spec:
  replicas: 1
  selector:
    matchLabels: { app: easyvcs }
  template:
    metadata:
      labels: { app: easyvcs }
    spec:
      containers:
        - name: easyvcs
          image: artifact.worker.svc.cluster.local/easyvcs/easyvcs:latest
          args: ["-addr", ":8080"]
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - secretRef: { name: easydev-secrets }
          readinessProbe:
            httpGet: { path: /api/v1/healthz, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /api/v1/healthz, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: easyvcs
  namespace: easydev
spec:
  selector: { app: easyvcs }
  ports:
    - { port: 80, targetPort: 8080, name: http }
