# Fill in real values before applying. Never commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: easydev-secrets
  namespace: easydev
type: Opaque
stringData:
  # easyvcs: a bootstrap admin token (the platform creates an "admin" user with it).
  EASYVCS_ADMIN_TOKEN: "change-me-admin-token"
  # easyops: the shared cluster-internal service token the gateway presents.
  EASYVCS_SERVICE_TOKEN: "change-me-service-token"
  # Postgres DSN used by BOTH easyvcs and easyblobs (they share the names).
  EASYVCS_DB_DRIVER: "postgres"
  EASYVCS_DB_DSN: "host=postgres easydev password=change-me dbname=easydev sslmode=disable"
  # S3 (Garage / MinIO / managed). Used by easyblobs for blob storage.
  EASYBLOBS_S3_ENDPOINT: "http://garage:3900"
  EASYBLOBS_S3_BUCKET: "easyblobs"
  EASYBLOBS_S3_REGION: "us-east-1"
  EASYBLOBS_S3_ACCESS_KEY: "change-me"
  EASYBLOBS_S3_SECRET_KEY: "change-me"
